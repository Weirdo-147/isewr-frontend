<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#1e40af" />
  
  <!-- Camera lens -->
  <circle cx="256" cy="256" r="150" fill="#60a5fa" stroke="#bfdbfe" stroke-width="10" />
  <circle cx="256" cy="256" r="100" fill="#2563eb" stroke="#dbeafe" stroke-width="5" />
  <circle cx="256" cy="256" r="60" fill="#1e40af" />
  
  <!-- Lens reflection -->
  <circle cx="200" cy="200" r="35" fill="#dbeafe" opacity="0.7" />
  <circle cx="180" cy="180" r="12" fill="white" opacity="0.9" />
  
  <!-- Text at bottom -->
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#dbeafe">LensLynx</text>
</svg> 